<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0720"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">

<title>مذاكرتي · ثانوية عامة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Identity v14: deep violet ground, turquoise neon accent, violet secondary glow. Subject colours unchanged. */
:root{
  --bg:#0c0720;--surface:#161030;--surface2:#211a4a;--line:#352a6e;
  --fg:#f3f0ff;--muted:#aca4d8;--accent:#2ee6d6;--accent-ink:#031d1b;--accent2:#8b5cf6;
  --good:#34d399;--warn:#fbbf24;--bad:#f87171;--shadow:0 8px 28px rgba(5,2,20,.45);
  --f-body:'IBM Plex Sans Arabic',Tahoma,'Segoe UI',system-ui,sans-serif;
  --f-disp:'Reem Kufi','IBM Plex Sans Arabic',Tahoma,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#f5f2ff;--surface:#ffffff;--surface2:#ece7fb;--line:#d8cff2;
  --fg:#1b1140;--muted:#5d5394;--accent:#08796f;--accent-ink:#ffffff;--accent2:#6d3fd8;
  --good:#12905f;--warn:#a96a10;--bad:#d03b3b;--shadow:0 8px 24px rgba(60,30,140,.12);color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f5f2ff;--surface:#ffffff;--surface2:#ece7fb;--line:#d8cff2;
  --fg:#1b1140;--muted:#5d5394;--accent:#08796f;--accent-ink:#ffffff;--accent2:#6d3fd8;
  --good:#12905f;--warn:#a96a10;--bad:#d03b3b;--shadow:0 8px 24px rgba(60,30,140,.12);color-scheme:light}
:root[data-theme="dark"]{
  --bg:#0c0720;--surface:#161030;--surface2:#211a4a;--line:#352a6e;
  --fg:#f3f0ff;--muted:#aca4d8;--accent:#2ee6d6;--accent-ink:#031d1b;--accent2:#8b5cf6;
  --good:#34d399;--warn:#fbbf24;--bad:#f87171;--shadow:0 8px 28px rgba(5,2,20,.45);color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.6 var(--f-body);-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:14px 110px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px 14px}
.top h1{margin:0;font:700 24px/1.2 var(--f-disp);color:var(--accent);letter-spacing:.2px}
.top small{display:block;color:var(--muted);font-size:13px}
.ibtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--fg)}
.ibtn svg{width:20px;height:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:14px}
.h2{font:700 18px/1.3 var(--f-disp);margin:0 0 10px}
.muted{color:var(--muted)}
.sm{font-size:13px}
.num{font-variant-numeric:tabular-nums}

/* date nav */
.dnav{display:flex;align-items:center;gap:8px}
.dnav .mid{flex:1;text-align:center;min-width:0}
.dnav .mid b{display:block;font:700 20px/1.2 var(--f-disp)}
.dnav .mid span{color:var(--muted);font-size:13px}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:500}
.pill.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* summary */
.sum{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.sum .txt{flex:1;min-width:150px}
.sum .big{font:700 22px/1.2 var(--f-disp)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px}
.kpi{background:var(--surface2);border-radius:14px;padding:10px 12px}
.kpi b{display:block;font:700 22px/1.2 var(--f-disp)}
.kpi span{font-size:12.5px;color:var(--muted)}

.next{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap;border-color:var(--accent)}
.next .l{min-width:0;flex:1 1 200px}
.next .tag{font-size:12px;color:var(--accent);font-weight:700;letter-spacing:.4px}
.btn{border:0;border-radius:12px;padding:10px 16px;background:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.ghost{background:var(--surface2);color:var(--fg);border:1px solid var(--line)}
.btn.bad{background:var(--bad);color:#fff}
.btn:disabled{opacity:.5}

/* rows */
.rows{display:flex;flex-direction:column;gap:10px}
.row{display:grid;grid-template-columns:78px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;position:relative;
  background-image:linear-gradient(to left,color-mix(in srgb,var(--c) 16%,transparent),transparent 55%)}
.row::before{content:"";position:absolute;inset-block:10px;inset-inline-start:0;width:4px;border-radius:4px;background:var(--c)}
.row.now{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 35%,transparent)}
.tm{display:flex;flex-direction:column;font-size:12.5px;color:var(--muted);line-height:1.5;padding-inline-start:6px}
.tm b{color:var(--fg);font-weight:600;font-size:13.5px}
.ti{min-width:0}
.chip{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 9px;border-radius:999px;color:#fff;background:var(--c)}
.tt{font-weight:600;margin-top:3px;overflow-wrap:anywhere}
.du{font-size:12px;color:var(--muted)}
.lockn{font-size:12px;color:var(--warn)}
.okn{font-size:12px;color:var(--good)}
.st{width:46px;height:46px;border-radius:50%;border:2px solid var(--line);background:var(--surface2);display:grid;place-items:center;color:#fff;transition:transform .12s}
.st:active{transform:scale(.9)}
.st svg{width:22px;height:22px}
.st.s1{background:var(--good);border-color:var(--good)}
.st.s2{background:var(--warn);border-color:var(--warn)}
.st.s3{background:var(--bad);border-color:var(--bad)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-inline-end:5px;vertical-align:-1px}

/* tabs */
.tabs{position:fixed;inset-inline:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:20}
.tabs .in{display:flex;gap:4px;width:100%;max-width:760px}
.tab{flex:1;border:0;background:transparent;border-radius:12px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:12px;font-weight:500}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--accent-ink);background:var(--accent);font-weight:700}

/* bars */
.bars{display:flex;flex-direction:column;gap:12px}
.bar .hd{display:flex;justify-content:space-between;gap:8px;align-items:baseline;font-size:14px}
.bar .hd b{display:flex;align-items:center;gap:8px}
.bar .dot{width:10px;height:10px;border-radius:50%;background:var(--c)}
.track{height:12px;background:var(--surface2);border-radius:8px;overflow:hidden;margin-top:5px}
.fill{height:100%;border-radius:8px;background:var(--c)}
.badge{font-size:11.5px;font-weight:700;padding:1px 9px;border-radius:999px;margin-inline-start:6px}
.badge.g{background:color-mix(in srgb,var(--good) 22%,transparent);color:var(--good)}
.badge.w{background:color-mix(in srgb,var(--warn) 22%,transparent);color:var(--warn)}
.badge.b{background:color-mix(in srgb,var(--bad) 22%,transparent);color:var(--bad)}
.ins{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.ins li{padding:10px 12px;border-radius:12px;background:var(--surface2);border-inline-start:4px solid var(--muted)}
.ins li.g{border-color:var(--good)}.ins li.w{border-color:var(--warn)}.ins li.b{border-color:var(--bad)}.ins li.i{border-color:var(--accent)}

/* heat */
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.hc{aspect-ratio:1;border-radius:9px;display:grid;place-items:center;font-size:12px;background:var(--surface2);color:var(--muted);border:1px solid transparent;min-width:0}
.hc.fut{opacity:.4}
.hc.tod{border-color:var(--accent);color:var(--fg);font-weight:700}
.hh{font-size:11.5px;text-align:center;color:var(--muted)}

/* week */
.wk{display:flex;flex-direction:column;gap:10px}
.wd{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;grid-template-columns:76px 1fr auto;gap:10px;align-items:center;width:100%;text-align:start}
.wd.tod{border-color:var(--accent)}
.wd b{font:700 16px/1.3 var(--f-disp);display:block}
.wd span.s{font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.sq{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:#fff;background:color-mix(in srgb,var(--c) 30%,var(--surface2));border:2px solid var(--c)}
.sq svg{width:14px;height:14px}
.sq.s1{background:var(--c)}
.sq.s2{background:linear-gradient(135deg,var(--c) 50%,transparent 50%)}
.sq.s3{background:repeating-linear-gradient(45deg,var(--surface2) 0 4px,color-mix(in srgb,var(--bad) 50%,var(--surface2)) 4px 8px);border-color:var(--bad)}
.sq.g{border-style:dashed}
.wp{font:700 18px/1 var(--f-disp);min-width:48px;text-align:center}

/* timer */
.tm-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.ringbox{position:relative;width:min(280px,78vw);aspect-ratio:1}
.ringbox svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringbox .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringbox .c b{font:700 54px/1 var(--f-disp);direction:ltr;font-variant-numeric:tabular-nums}
.ringbox .c span{color:var(--muted);margin-top:6px}
.ctr{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.ctr .btn{min-width:110px}
select,input[type=text],input[type=number],input[type=date]{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0;width:100%}
.frm{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.frm .w2{grid-column:1/-1}
label.lb{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:8px}
.it{display:flex;align-items:center;gap:10px;background:var(--surface2);border-radius:12px;padding:9px 12px}
.it .g{flex:1;min-width:0;overflow-wrap:anywhere}
.it .sc{font:700 18px/1 var(--f-disp);min-width:54px;text-align:center}
.x{border:0;background:transparent;color:var(--muted);width:32px;height:32px;border-radius:8px;display:grid;place-items:center}
.x svg{width:18px;height:18px}
.chk{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;color:#fff;flex:none}
.chk.on{background:var(--good);border-color:var(--good)}
.chk svg{width:16px;height:16px}
.it.dn .g{text-decoration:line-through;color:var(--muted)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.empty{text-align:center;color:var(--muted);padding:18px 8px}

/* sheet */
.sheet{position:fixed;inset:0;background:rgba(3,10,25,.6);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet .p{background:var(--bg);width:100%;max-width:760px;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px));border:1px solid var(--line)}
.sheet .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sheet .hd h2{margin:0;font:700 20px var(--f-disp)}
.sync{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;padding:3px 10px;border-radius:999px;background:var(--surface2);color:var(--muted)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--warn)}
.sync.c i{background:var(--good)}
.steps{margin:0;padding-inline-start:20px;color:var(--muted)}
.toast{position:fixed;inset-inline:0;bottom:calc(86px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:50;pointer-events:none}
.toast span{background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:999px;font-weight:600;font-size:13.5px}
@media (min-width:700px){.app{padding-top:24px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* ===== v2 additions ===== */
:root[data-accent="sunset"]{--accent:#ffb454;--accent-ink:#2b1700}
:root[data-accent="forest"]{--accent:#4ade80;--accent-ink:#06280f}
:root[data-accent="violet"]{--accent:#b79bff;--accent-ink:#1e0b4d}
@media (prefers-color-scheme: light){
 :root[data-accent="sunset"]:not([data-theme="dark"]){--accent:#b45f06;--accent-ink:#fff}
 :root[data-accent="forest"]:not([data-theme="dark"]){--accent:#15803d;--accent-ink:#fff}
 :root[data-accent="violet"]:not([data-theme="dark"]){--accent:#6d3fd8;--accent-ink:#fff}}
:root[data-theme="light"][data-accent="sunset"]{--accent:#b45f06;--accent-ink:#fff}
:root[data-theme="light"][data-accent="forest"]{--accent:#15803d;--accent-ink:#fff}
:root[data-theme="light"][data-accent="violet"]{--accent:#6d3fd8;--accent-ink:#fff}
.app{zoom:var(--zoom,1)}
.top .sub{display:block;color:var(--muted);font-size:13px}
.pghd{display:flex;align-items:center;gap:10px}
.pghd h2{margin:0;font:700 22px/1.2 var(--f-disp);flex:1}
.h3{font:700 15px/1.3 var(--f-disp);margin:16px 0 8px}
.card.mot{background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 14%,var(--surface)),var(--surface))}
.mvh{font:700 20px/1.4 var(--f-disp);margin-bottom:4px;white-space:pre-line}
.lvl{margin-top:14px}.lvh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}.lvh b{font:700 15px var(--f-disp)}.lvh .num{margin-inline-start:auto;font-size:13px}
.lvl .track{margin-top:0}
.startc{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-color:var(--accent)}
.startc .l{flex:1 1 200px;min-width:0}.startc .tag,.next .tag{font-size:12px;color:var(--accent);font-weight:700;letter-spacing:.4px}
.btn.big{padding:14px 20px;font-size:16px;flex:1 1 200px}
.card.alert{border-color:var(--warn)}
.card.alert.warn{border-color:var(--bad)}
.card.lnk{display:flex;flex-direction:column;gap:2px;text-align:start;width:100%;cursor:pointer}
.card.lnk2{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;padding:12px 16px}
.card.lnk2 .tag{font-size:12px;color:var(--accent);font-weight:700}
.row{grid-template-columns:78px 1fr auto}
.acts{display:flex;flex-direction:column;align-items:center;gap:6px}
.mbtn{width:34px;height:28px;border:0;background:transparent;color:var(--muted);border-radius:8px;display:grid;place-items:center}
.mbtn svg{width:20px;height:20px}
.gostart{margin-top:6px;border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:999px;padding:2px 12px;font-size:12.5px;font-weight:700}
.ty{display:inline-block;margin-inline-start:6px;font-size:11.5px;color:var(--muted)}
.mini{height:5px;background:var(--surface2);border-radius:4px;margin-top:6px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--c);border-radius:4px}
.row.mv{opacity:.55}
.st.s4{background:var(--muted);border-color:var(--muted)}
.st.s5{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tbtn{border:0;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:2px 12px;font-weight:700;margin-inline-start:8px;pointer-events:auto}
.toast span{pointer-events:auto}
.cols{position:relative;display:flex;gap:6px;align-items:flex-end;height:150px;padding-top:6px}
.col{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px}
.cb{width:100%;max-width:34px;border-radius:6px 6px 3px 3px}
.cv{font-size:10.5px;color:var(--muted);white-space:nowrap;height:14px}
.cl{font-size:11px;color:var(--muted);height:20px;line-height:20px;white-space:nowrap}
.gl{position:absolute;inset-inline:0;border-top:2px dashed var(--accent);opacity:.7;pointer-events:none}
.stk{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--surface2)}
.stk i{display:block;height:100%}
.hmap{display:grid;grid-template-columns:repeat(14,1fr);grid-template-rows:repeat(7,auto);grid-auto-flow:column;gap:4px}
.hz{display:block;aspect-ratio:1;border-radius:4px;background:var(--surface2);min-width:0}
.hz.l1{background:color-mix(in srgb,var(--accent) 28%,var(--surface2))}
.hz.l2{background:color-mix(in srgb,var(--accent) 52%,var(--surface2))}
.hz.l3{background:color-mix(in srgb,var(--accent) 76%,var(--surface2))}
.hz.l4{background:var(--accent)}
.hz.lf{background:transparent;border:1px dashed var(--line)}
.hz.in{display:inline-block;width:14px;height:14px;aspect-ratio:auto}
.calg{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cd{aspect-ratio:1;border-radius:10px;border:1px solid transparent;background:var(--surface2);color:var(--fg);display:grid;place-items:center;font-weight:600;min-width:0}
.cd.ex{background:var(--good);color:#fff}.cd.mid{background:var(--warn);color:#1b1200}.cd.weak{background:var(--bad);color:#fff}
.cd.fut{opacity:.45}.cd.tod{outline:2px solid var(--accent);outline-offset:1px}
.subc{display:flex;align-items:center;gap:14px;text-align:start;width:100%;border-inline-start:5px solid var(--c);cursor:pointer}
.subc .l{flex:1;min-width:0}.subc>svg{width:18px;height:18px;color:var(--muted)}
.dots{display:inline-flex;gap:4px;vertical-align:middle}.dots i{width:9px;height:9px;border-radius:50%;background:var(--surface);border:1px solid var(--line)}.dots i.on{background:var(--good);border-color:var(--good)}
.achg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ach{background:var(--surface2);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:4px;opacity:.6}
.ach.on{opacity:1;border:1px solid var(--accent)}
.ach .ai{width:28px;height:28px;color:var(--muted)}.ach.on .ai{color:var(--accent)}.ach .ai svg{width:100%;height:100%}
.ach b{font-size:14px}.ach span{font-size:12px;color:var(--muted)}
.tl{display:flex;flex-direction:column;gap:12px;border-inline-start:2px solid var(--line);padding-inline-start:16px;margin-inline-start:6px}
.te{position:relative}.te i{position:absolute;inset-inline-start:-23px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.mlink{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:start;color:var(--fg)}
.mlink svg{width:26px;height:26px;color:var(--accent)}
.nb{position:absolute;inset-inline-end:12px;top:12px;min-width:22px;height:22px;border-radius:11px;background:var(--bad);color:#fff;font-style:normal;font-size:12px;font-weight:700;display:grid;place-items:center;padding-inline:6px}
.chkr{display:flex;align-items:center;gap:10px;cursor:pointer}
.chkr input{width:20px;height:20px;accent-color:var(--accent)}
.it.lnkit{width:100%;border:0;text-align:start;cursor:pointer}.it.lnkit>svg{width:16px;height:16px;color:var(--muted)}

<script>
(()=>{

const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;

const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};

/* دقائق من منتصف ليل اليوم d (بتعدّي 1440 لو d كان امبارح) — علشان المهام اللي بتعدّي منتصف الليل */
const nowAbs=d=>Math.round((new Date(new Date().getFullYear(),new Date().getMonth(),new Date().getDate(),12)-parse(d))/864e5)*1440+nowMin();
let DEV=false;try{DEV=/[?&]dev=1/.test(location.search)||localStorage.getItem('st.dev')==='1'}catch(_){}
const dbg=(w,e)=>{try{if(DEV)console.warn('[مذاكرتي]',w,e)}catch(_){}};
const dIdx=s=>(parse(s).getDay()+1)%7;           // 0 = السبت
const weekStart=s=>addDays(s,-dIdx(s));
const daysBetween=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const DAYS=['السبت','الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة'];
const MONTHS=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const dateTxt=s=>{const d=parse(s);return d.getDate()+' '+MONTHS[d.getMonth()]};
const t12=m=>{m=((m%1440)+1440)%1440;const h=Math.floor(m/60),mm=m%60;return `${h%12||12}:${pad(mm)} ${h>=12?'م':'ص'}`};
const hm=m=>{m=Math.round(m);const h=Math.floor(m/60),r=m%60;return h&&r?`${h}س ${r}د`:h?`${h} ساعة`:`${r} دقيقة`};
const hmShort=m=>{m=Math.round(m);const h=Math.floor(m/60),r=m%60;return h?(r?`${h}س ${r}د`:`${h}س`):`${r}د`};

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));

/* ---------- schedule (from the timetable) ---------- */

  math:{n:'رياضيات',c:'#2f80ed'},chem:{n:'كيمياء',c:'#e84c3d'},phys:{n:'فيزياء',c:'#27ae60'},

  if(!STUDY.includes(b.sub))return'other';

    const pn=v=>Number.isFinite(+v)&&+v>0?Math.round(+v):0,ok=pn(x.st)&&pn(x.en)&&pn(x.en)>=pn(x.st);

    if(ok){y.st=pn(x.st);y.en=pn(x.en)}if(pn(x.sec))y.sec=Math.min(pn(x.sec),43200);if(pn(x.pz))y.pz=Math.min(999,Math.floor(pn(x.pz)));if(x.end==='natural'||x.end==='manual')y.end=x.end;

   0) لو فيه جلسة مؤقت شغالة ← نوجّه ليها ومنبدأش تانية.

   7) غير كده: رسالة واضحة من غير تخمين. ---------- */
/* v15: معلومات مساعدة للاختيار (قراءة بس): أولوية التراكم، درجات المادة مقابل الهدف، نقاط الضعف المفتوحة، المدة المتبقية والوقت المتاح.
   ماتغيّرش ترتيب القواعد 0–7 فوق؛ بتتحكم بس في الاختيار بين مهام متأخرة (أو قادمة) متساوية في الأولوية، وفي سبب العرض. */
function needOf(x){
  const sub=STUDY.includes(x.bl)?x.bl:x.sub,why=[];let n=0;
  if(x.bl){const i=topBl(x.bl);if(i){n+=5-i.pri;why.push(`التراكم المرتبط (${esc(i.t)}) أولويته ${i.pri}: ${PRI[i.pri]}`)}}
  const sc=(S.scores||[]).filter(z=>z.sub===sub&&z.max>0).sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:0).slice(0,3);
  if(sc.length){const a=sc.reduce((p,z)=>p+z.score/z.max*100,0)/sc.length;if(a<S.cfg.target){n+=Math.min(3,(S.cfg.target-a)/10);why.push(`متوسط آخر ${sc.length>1?sc.length+' اختبارات':'اختبار'} في ${SUBJ[sub].n} ${Math.round(a)}% تحت هدفك (${S.cfg.target}%)`)}}
  const w=(S.weak||[]).filter(z=>z.sub===sub&&!z.done).length;
  if(w){n+=w>=3?2:1;why.push(`فيه ${w} ${w>2?'نقاط':'نقطة'} ضعف مسجّلة في ${SUBJ[sub].n}`)}
  return{n,why};
}
function infoOf(x,avail){
  const logged=taskMins(x.key),rem=Math.max(10,x.dur-logged);
  const mins=avail!=null&&avail>=10?Math.min(rem,avail):rem;
  const goalRem=Math.max(0,S.cfg.goalDay-minsOn(today()));
  return{mins,rem,logged,avail,fits:avail==null||x.dur<=avail||rem<=avail,goalRem,need:needOf(x)};
}
function pickNow(){
  if(T.running||tElapsed()>0)return{kind:'running'};
  const t=today(),nm=nowMin(),y=addDays(t,-1);
  const absS=x=>x.s-daysBetween(x.date,t)*1440,absE=x=>x.e-daysBetween(x.date,t)*1440;
  const cmp=(a,b)=>absS(a)-absS(b)||absE(a)-absE(b)||(a.key<b.key?-1:a.key>b.key?1:0);
  const open=x=>{const v=st(x.date,x.id);return isStudyT(x)&&counted(x)&&(v===0||v===3)};
  // الأنشطة الشغالة دلوقتي (من امبارح واليوم) — الحالة 0 (أو 3 لمهمة مذاكرة) بتشغل الوقت؛ 1/2/4/5 معناها المستخدم خلّص منها فالوقت فاضي
  const nowItems=[];
  for(const d of [y,t]){const a=nowAbs(d);tasksOf(d).forEach(x=>{const v=st(d,x.id);if(x.s<=a&&a<x.e&&(v===0||(v===3&&open(x))))nowItems.push(x)})}
  const curS=nowItems.filter(open).sort(cmp);
  const upcomingOpen=(from,to)=>{const o=[];for(const d of eachDate(from,to))tasksOf(d).forEach(x=>{if(open(x)&&(d>t||x.s>nm))o.push(x)});return o.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.s-b.s||a.e-b.e||(a.key<b.key?-1:1))};
  const nextOcc=tasksOf(t).filter(x=>x.s>nm&&st(t,x.id)!==1&&st(t,x.id)!==4&&st(t,x.id)!==5).sort((a,b)=>a.s-b.s||a.e-b.e||(a.key<b.key?-1:1))[0]||null;
  if(curS.length){const x=curS[0],a=nowAbs(x.date);
    return{kind:'current',task:x,info:infoOf(x,x.e-a),left:x.e-a,overlap:curS.slice(1).concat(nowItems.filter(z=>!open(z))).map(z=>z.t),next:nextOcc}}
  if(nowItems.length){const b=nowItems.sort(cmp)[0],a=nowAbs(b.date);
    return{kind:'busy',busy:b,until:b.e-a,upcoming:upcomingOpen(t,addDays(t,7))[0]||null}}
  const exams=upcomingExams(),exd=sub=>{const e=exams.find(e=>e.sub===sub);if(!e)return 99;const d=daysBetween(t,e.date);return d>=0&&d<=7?d:99};
  const avail=nextOcc?nextOcc.s-nm:null;
  // الحصص الثابتة (cat=cls) مابتتعوّضش كمهمة مذاكرة ذاتية (زي خطة التعويض)، فمانقترحهاش هنا
  const inf=new Map(),I=x=>{if(!inf.has(x.key))inf.set(x.key,infoOf(x,avail));return inf.get(x.key)};
  const od=overdue().filter(x=>x.cat!=='cls').sort((a,b)=>exd(a.sub)-exd(b.sub)||(I(b).fits-I(a).fits)||(I(b).need.n-I(a).need.n)||(a.date<b.date?-1:a.date>b.date?1:0)||cmp(a,b));
  if(od.length){const x=od[0];return{kind:'overdue',task:x,exam:exd(x.sub)<99?exd(x.sub):null,count:od.length,next:nextOcc,info:I(x),alt:od[1]||null}}
  const todayLeft=upcomingOpen(t,t);
  if(todayLeft.length){const x=todayLeft[0];return{kind:'upcoming',task:x,wait:x.s-nm,next:null,info:infoOf(x,null),alt:todayLeft[1]||null}}
  const rv=reviewsDue()[0];
  if(rv)return{kind:'review',review:rv}
  const nxs=upcomingOpen(addDays(t,1),addDays(t,7)),nx=nxs[0];
  if(nx)return{kind:'next',task:nx,info:infoOf(nx,null),alt:nxs[1]||null};
  return{kind:'none'};
}

  if(g.task&&g.task.bl)step+=' '+esc(blHint(g.task));

function nextDue(r){if(r.fin)return null;let d=addDays(r.learned,INTERVALS[Math.min(r.stage,INTERVALS.length-1)]);if(r.floor&&d<r.floor)d=r.floor;return d}
const reviewsDue=()=>S.reviews.filter(r=>!r.fin&&nextDue(r)<=today());
function upcomingExams(){return S.exams.filter(e=>!e.scoreId).sort((a,b)=>a.date<b.date?-1:1)}

/* ---------- calc: XP · streak · levels (derived, never double counted) ---------- */
let _c=null,_ck='';
const need=n=>800+100*(n-1);
function calc(){
  const t0=today();
  const k=S.rev+'|'+S.updatedAt+'|'+t0+'|'+S.log.length+'|'+S.created+'|'+S.v3from+'|'+S.spent;
  if(_ck===k)return _c;
  const V3=S.v3from||'0000-00-00';
  const mD={},maxS={},tM={},manD={};            // دقائق اليوم · أطول جلسة مؤقت · دقائق كل مهمة · دقائق يدوي
  for(const x of S.log){mD[x.date]=(mD[x.date]||0)+x.min;tM[x.task]=(tM[x.task]||0)+x.min;
    if(x.src==='timer'){if(x.min>(maxS[x.date]||0))maxS[x.date]=x.min}else manD[x.date]=(manD[x.date]||0)+x.min}
  const days=eachDate(S.created,t0),xpDay={},qual={},prot=[];
  let streak=0,longest=0,shields=1,run=0,goalDays=0,hardDays=0,doneTasks=0;
  const add=(d,v)=>{if(v)xpDay[d]=(xpDay[d]||0)+v};
  for(const x of S.log)if(x.src==='timer')add(x.date,x.min);
  for(const d in manD)add(d,d>=V3?Math.floor(Math.min(manD[d],180)/2):Math.floor(manD[d]/2));   // سقف يدوي 180 دقيقة/يوم (من v3)
  for(const d of days){
    const all=tasksOf(d),ts=all.filter(counted),ss=ts.filter(isStudyT);
    const m=mD[d]||0,doneS=ss.filter(x=>st(d,x.id)===1).length,nw=d>=V3;
    /* يوم مذاكرة = الحد الأدنى اليومي، أو جلسة حقيقية 20 دقيقة+، أو إنقاذ اليوم. (قبل v3: القاعدة القديمة) */
    const q=nw?(m>=S.cfg.minDaily||(maxS[d]||0)>=20||!!(S.resc||{})[d]):(m>=S.cfg.minDaily||doneS>=1);qual[d]=q;
    for(const x of ts){const s=st(d,x.id);if(s!==1&&s!==2)continue;
      const real=!nw||(tM[x.key]||0)>=Math.min(10,x.dur*.25)||!isStudyT(x);   // من v3: الـXP الكامل لمهمة المذاكرة محتاج وقت مسجّل
      if(s===1){doneTasks++;add(d,real?(isStudyT(x)?20:10):(isStudyT(x)?8:4));if(x.from)add(d,real?10:3)}
      else add(d,real?10:3)}
    if(m>=S.cfg.goalDay){goalDays++;add(d,30)}
    if(ts.length>=2&&ts.every(x=>st(d,x.id)===1)&&(!nw||m>=Math.max(S.cfg.minDaily,30)))add(d,50);
    const planS=ss.reduce((a,x)=>a+x.dur,0);
    if(ss.length>=2&&planS>=300&&ss.every(x=>st(d,x.id)===1)&&(!nw||m>=planS*.4))hardDays++;
    if(d<t0){
      if(q){streak++;run++;if(run%7===0)shields=Math.min(2,shields+1);add(d,5*Math.min(streak,10))}
      else if(shields>0&&streak>0){shields--;prot.push(d)}
      else{streak=0;run=0}
    }else if(q){streak++;run++;add(d,5*Math.min(streak,10))}
    if(streak>longest)longest=streak;
  }
  let weeksFull=0;
  for(let ws=weekStart(S.created);addDays(ws,6)<t0;ws=addDays(ws,7)){
    const a=agg(ws,addDays(ws,6));
    if(a.due>=3&&a.sc/a.due>=.9){weeksFull++;add(addDays(ws,6),100)}
  }
  const scN={};
  for(const x of S.scores){const n=scN[x.date]=(scN[x.date]||0)+1;if(x.date>=V3&&n>2)continue;add(x.date,40);if(x.score/x.max*100>=S.cfg.target)add(x.date,20)}   // أقصى درجتين XP في اليوم
  const rvN={};
  for(const r of S.reviews)for(const h of (r.hist||[])){const n=rvN[h]=(rvN[h]||0)+1;if(h>=V3&&n>6)continue;add(h,10)}   // أقصى 6 مراجعات XP في اليوم
  let xp=0;Object.values(xpDay).forEach(v=>xp+=v);
  let lv=1,rem=xp;while(rem>=need(lv)){rem-=need(lv);lv++}
  const levelDates={};let cum=0,l2=1,th=need(1);
  Object.keys(xpDay).sort().forEach(d=>{cum+=xpDay[d];while(cum>=th){l2++;levelDates[l2]=d;th+=need(l2)}});
  _c={xp,xpDay,lv,cur:rem,need:need(lv),streak,longest,shields,qual,prot,coins:Math.max(0,Math.floor(xp/4)-S.spent),goalDays,hardDays,weeksFull,doneTasks,levelDates};
  _ck=k;return _c;
}

/* ---------- progress (واقعي) ---------- */
function prog(from,to){
  const a=agg(from,to),w=S.cfg.w,days=daysBetween(from,to)+1;
  const comps=[];
  comps.push(['تنفيذ المهام',a.due?a.sc/a.due:null,w.tasks]);
  comps.push(['الالتزام بالجدول',a.planM?a.doneM/a.planM:null,w.adh]);
  const goal=S.cfg.goalWeek*days/7,tm=minsRange(from,to);
  comps.push(['وقت المذاكرة',goal?clamp(tm/goal,0,1):null,w.time]);
  const sc=S.scores.filter(x=>x.date>=from&&x.date<=to);
  comps.push(['الاختبارات',sc.length?clamp(sc.reduce((p,x)=>p+x.score/x.max*100,0)/sc.length/S.cfg.target,0,1):null,w.tests]);
  let rd=0;S.reviews.forEach(r=>(r.hist||[]).forEach(h=>{if(h>=from&&h<=to)rd++}));
  const pend=S.reviews.filter(r=>!r.fin&&nextDue(r)>=from&&nextDue(r)<=Math.min(to,today())).length;
  comps.push(['المراجعة',rd+pend?rd/(rd+pend):null,w.rev]);
  let ws=0,sum=0;comps.forEach(c=>{if(c[1]!==null&&c[2]>0){ws+=c[2];sum+=c[1]*c[2]}});
  return{p:ws?sum/ws:0,has:ws>0,comps,a};
}

/* ---------- audio ---------- */
let actx=null;
function getCtx(){actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();return actx}
function beep0(){try{getCtx()}catch(e){}}
function beep(){
  if(S.cfg.beep){try{const c=getCtx();
    [0,.3,.6].forEach(o=>{const os=c.createOscillator(),g=c.createGain();os.frequency.value=o===.6?988:784;os.connect(g);g.connect(c.destination);
      const t=c.currentTime+o;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.25,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.25);os.start(t);os.stop(t+.28)});
  }catch(e){}}
  if(S.cfg.vibrate){try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
}
let amb=null;
function ambStop(){try{if(amb){amb.src.stop();if(amb.lfo)amb.lfo.stop()}}catch(e){}amb=null}
function ambStart(kind){
  ambStop();if(!kind||kind==='none')return;
  try{
    const c=getCtx(),len=c.sampleRate*3,buf=c.createBuffer(1,len,c.sampleRate),d=buf.getChannelData(0);let l=0;
    for(let i=0;i<len;i++){const w=Math.random()*2-1;if(kind==='rain')d[i]=w*.5;else{l=(l+.02*w)/1.02;d[i]=l*3.2}}
    const src=c.createBufferSource();src.buffer=buf;src.loop=true;
    const g=c.createGain();g.gain.value=kind==='rain'?.05:.12;
    if(kind==='rain'){const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=1800;f.Q.value=.5;src.connect(f);f.connect(g)}else src.connect(g);
    g.connect(c.destination);let lfo=null;
    if(kind==='waves'){lfo=c.createOscillator();lfo.frequency.value=.12;const lg=c.createGain();lg.gain.value=.09;lfo.connect(lg);lg.connect(g.gain);lfo.start()}
    src.start();amb={src,lfo};
  }catch(e){amb=null}
}

/* ---------- log time ---------- */
function addLog(o){
  const mn=Math.round(+o.min);if(!(mn>=1))return null;                       // مفيش سجل صفر/سالب
  let d=/^\d{4}-\d{2}-\d{2}$/.test(o.date||'')?o.date:today();if(d>today())d=today();
  if(o.sid&&S.log.some(l=>l.sid===o.sid))return null;                          // نفس الجلسة ماتتسجلش مرتين
  const e={id:uid('l'),date:d,ts:Date.now(),sub:STUDY.concat(['gym','gen']).includes(o.sub)?o.sub:'math',task:o.task||'',min:Math.min(720,mn),src:o.src==='timer'?'timer':'manual',type:o.type||'study'};
  if(o.sid)e.sid=o.sid;
  /* بيانات الجلسة (اختيارية): بداية/نهاية فعلية بالطابع الزمني، الثواني الفعلية، عدد الإيقافات، وإزاي خلصت */
  const pn=v=>Number.isFinite(+v)&&+v>0?Math.round(+v):0;
  if(pn(o.st)&&pn(o.en)&&pn(o.en)>=pn(o.st)){e.st=pn(o.st);e.en=pn(o.en)}
  if(pn(o.sec))e.sec=Math.min(pn(o.sec),43200);
  if(Number.isFinite(+o.pz)&&+o.pz>0)e.pz=Math.min(999,Math.floor(+o.pz));
  if(o.end==='natural'||o.end==='manual')e.end=o.end;
  S.log.push(e);return e;
}

const newT=()=>({mode:'focus',kind:'pomo',f:30,r:10,left:null,running:false,endAt:0,acc:0,startAt:0,seen:0,sub:'',task:'',rescue:0,sid:'',day:'',t0:0,pz:0});
/* تنضيف حالة المؤقت المحفوظة: أي قيمة ناقصة أو غريبة بترجع لقيمة آمنة، ومابنمسحش حاجة من بيانات المذاكرة */
function cleanT(t){
  const d=newT(),r=Object.assign(d,t),nn=(v,def)=>Number.isFinite(+v)&&+v>=0?+v:def;
  r.mode=r.mode==='rest'?'rest':'focus';r.kind=r.kind==='open'?'open':'pomo';
  r.f=nn(r.f,30)||30;r.r=nn(r.r,10);r.left=r.left==null?null:nn(r.left,null);
  r.endAt=nn(r.endAt,0);r.acc=nn(r.acc,0);r.startAt=nn(r.startAt,0);r.seen=nn(r.seen,0);r.t0=nn(r.t0,0);r.pz=Math.floor(nn(r.pz,0));
  r.running=r.running===true;r.rescue=[0,1,2].includes(+r.rescue)?+r.rescue:0;
  r.sub=typeof r.sub==='string'&&SUBJ[r.sub]?r.sub:'';r.task=typeof r.task==='string'?r.task:'';r.sid=typeof r.sid==='string'?r.sid:'';r.day=/^\d{4}-\d{2}-\d{2}$/.test(r.day||'')?r.day:'';
  if(r.running&&(r.kind==='open'?!(r.startAt>0):!(r.endAt>0)))r.running=false;     // بيانات ناقصة: نوقفها بدل ما نخمّن
  return r;
}

function tick(){
  if(T.running){

    {const n=Date.now();if(n-(T.seen||0)>=5000){T.seen=n;saveT()}}        // نبضة: بنعرف آخر مرة التطبيق كان فعلًا شغال

const clk=s=>{const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return(h?pad(h)+':':'')+pad(m)+':'+pad(s%60)};

/* ---------- reschedule ---------- */
const slotAny=(date,dur)=>findSlot(date,dur)??findSlot(date,dur,660);   // أول مرة من 3م، وبعدها من 11ص (مش قبلها: الصحيان 9–10 والعيش والطلبات)
function findSlot(date,dur,from0){
  let start=from0||900;if(date===today())start=Math.max(start,Math.ceil((nowMin()+10)/15)*15);
  if(date<today())return null;
  const b=tasksOf(addDays(date,-1)).filter(x=>x.e>1440).map(x=>[x.s-1440-10,x.e-1440+10]).concat(tasksOf(date).map(x=>[x.s-10,x.e+10]));   // بنحسب كمان اللي بيعدّي منتصف الليل من امبارح
  for(let t=start;t+dur<=1380;t+=15){if(b.every(([s,e])=>t+dur<=s||t>=e))return t}
  return null;
}
const extraOn=d=>S.custom.filter(c=>c.date===d&&c.from);
const extraUsed=d=>extraOn(d).reduce((a,c)=>a+(c.e-c.s),0);
function unmove(k){          // رجوع المهمة الأصلية من "اتأجلت": بنشيل النسخة اللي لسه ما اتعملتش
  S.custom=S.custom.filter(c=>!(c.from===k&&st(c.date,c.id)===0));
  if(S.ov[k])delete S.ov[k].movedTo;
}
function markMoved(key,date){S.done[key]=5;S.ov[key]=Object.assign({},S.ov[key],{movedTo:date})}
function distribute(list,endDate,opt){
  opt=opt||{};
  const t=today(),exams=upcomingExams();let placed=0;
  const pri=x=>{const e=exams.find(e=>e.sub===x.sub);return e?daysBetween(t,e.date):999};
  list=list.slice().sort((a,b)=>pri(a)-pri(b)||(a.date<b.date?-1:1));
  distribute.fail=0;
  for(const x of list){
    if(st(x.date,x.id)===5||st(x.date,x.id)===1)continue;
    const n=Math.max(1,Math.ceil(x.dur/60)),piece=Math.max(5,Math.round(x.dur/n/5)*5);   // المهمة الطويلة بتتقسم أجزاء ≤60 دقيقة، ومفيش وقت بيتشال
    const added=[];let ok=true,lastD=null;
    for(let k=0;k<n&&ok;k++){
      const dur=k===n-1?Math.max(5,x.dur-piece*(n-1)):piece;let hit=false;
      for(let i=0;i<(opt.days||15);i++){
        const d=addDays(t,i);
        if(extraUsed(d)+dur>S.cfg.extraCap||extraOn(d).length>=2)continue;
        const slot=slotAny(d,dur);if(slot===null)continue;
        const c={id:uid('c'),date:d,s:slot,e:slot+dur,sub:x.sub,t:'تعويض: '+x.t.replace(/^تعويض: /,'')+(n>1?` (جزء ${k+1}/${n})`:''),type:x.type==='watch'?'review':x.type,from:x.key};
        S.custom.push(c);added.push(c);lastD=lastD||d;hit=true;break;
      }
      if(!hit)ok=false;
    }
    if(ok){markMoved(x.key,lastD);placed++}
    else{S.custom=S.custom.filter(c=>!added.includes(c));distribute.fail++}      // لو مش كلها دخلت: نرجّع كل حاجة زي ما كانت
  }
  if(placed&&!opt.dry)save();
  return placed;
}

/* ---------- المساعد المحلي (قواعد ثابتة — مش نموذج ذكاء اصطناعي) ---------- */
const dayLbl=d=>{const t=today();return d===t?'النهارده':d===addDays(t,1)?'بكرة':DAYS[dIdx(d)]+' '+dateTxt(d)};
/* خطة تعويض مقترحة: بنجرّب نفس قواعد التوزيع الموجودة (حد أقصى للتعويض في اليوم، ومفيش تعارض مع الدروس) من غير ما نغيّر أي حاجة */
function planCatchup(list,days){
  const snap=JSON.stringify([S.custom,S.done,S.ov]),before=new Set(S.custom.map(c=>c.id)),exams=upcomingExams(),t=today();
  let out={};
  try{
    distribute(list,null,{dry:true,days:days||15});
    S.custom.filter(c=>!before.has(c.id)).forEach(c=>{(out[c.from]=out[c.from]||[]).push({date:c.date,s:c.s,e:c.e,sub:c.sub,t:c.t,type:c.type})});
  }finally{const r=JSON.parse(snap);S.custom=r[0];S.done=r[1];S.ov=r[2]}
  return list.map(x=>{const e=exams.find(e=>e.sub===x.sub),dd=e?daysBetween(t,e.date):null;
    return{key:x.key,sub:x.sub,t:x.t,dur:x.dur,from:x.date,pieces:(out[x.key]||[]).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.s-b.s),
      why:dd!==null&&dd>=0&&dd<=14?`امتحان ${SUBJ[x.sub].n} بعد ${dd?dd+' يوم':'النهارده'}`:`فاتت من ${dayLbl(x.date)}`}});
}
function withPending(skip,fn){      // بنحط القطع المقترحة مؤقتًا في الجدول عشان الحساب يشوفها، وبنشيلها بعد كده
  const tmp=[];((UI.cu&&UI.cu.items)||[]).forEach(it=>{if(it.key!==skip)it.pieces.forEach(pc=>tmp.push({id:uid('tmp'),date:pc.date,s:pc.s,e:pc.e,sub:pc.sub,t:pc.t,type:pc.type,from:it.key}))});
  const keep=S.custom;S.custom=keep.concat(tmp);try{return fn()}finally{S.custom=keep}
}
function slotFree(date,s,e){
  if(date<today()||e>1380||s<0)return false;
  const b=tasksOf(addDays(date,-1)).filter(x=>x.e>1440).map(x=>[x.s-1440-10,x.e-1440+10]).concat(tasksOf(date).map(x=>[x.s-10,x.e+10]));
  return b.every(([a,z])=>e<=a||s>=z);
}
function cuMake(days,only){

  const skip={bk:od.filter(x=>x.cat==='bk').length,cls:od.filter(x=>x.cat==='cls').length};od=od.filter(x=>x.cat!=='bk'&&x.cat!=='cls');   // التراكم بيكمّله بلوكاته الأسبوعية، والحصة مش بتتعوّض كمهمة
  UI.cu={days:days||15,items:planCatchup(od,days||15),ts:Date.now(),skip};

function cuAccept(k){
  const c=UI.cu;if(!c)return 0;const it=c.items.find(x=>x.key===k);if(!it||!it.pieces.length)return 0;
  const x=findTask(k);if(!x||[1,5].includes(st(x.date,x.id))){toast('المهمة دي اتغيّرت حالتها');c.items=c.items.filter(z=>z.key!==k);return 0}
  for(const pc of it.pieces){if(!slotFree(pc.date,pc.s,pc.e)||extraUsed(pc.date)+(pc.e-pc.s)>S.cfg.extraCap||extraOn(pc.date).length>=2){toast('الوقت ده اتشغل — حدّث الخطة');return 0}}
  it.pieces.forEach(pc=>S.custom.push({id:uid('c'),date:pc.date,s:pc.s,e:pc.e,sub:pc.sub,t:pc.t,type:pc.type,from:k}));
  markMoved(k,it.pieces[0].date);save();c.items=c.items.filter(z=>z.key!==k);return 1;
}
function cuChangeDay(k,date){

  if(slot===null||slot===undefined){toast('اليوم ده زحمة أو مفيش وقت فاضي — اختار يوم تاني');return false}

}

function weekFacts(){
  const t=today(),ws=weekStart(t),we=addDays(ws,6),a=agg(ws,t);
  const act={};S.log.forEach(x=>{if(x.date>=ws&&x.date<=we)act[x.sub]=(act[x.sub]||0)+x.min});
  const subs=STUDY.map(k=>{const o=a.subj[k]||{due:0,sc:0};return{k,due:o.due,rate:o.due?o.sc/o.due:null,min:act[k]||0}}).filter(z=>z.due>0||z.min>0);
  return{a,rate:a.due?a.sc/a.due:null,actual:minsRange(ws,we),subs};
}
const ASK_CHIPS=[['أذاكر إيه دلوقتي؟','now'],['أنا متأخر في إيه؟','late'],['رتّب لي باقي اليوم','plan'],['اقترح خطة تعويض','catchup'],['أنا ماشي ازاي الأسبوع ده؟','progress'],['باقي كام على الامتحان؟','exams']];
function intentOf(q){
  const n=nz(q),has=(...w)=>w.some(x=>n.includes(nz(x)));
  if(has('تعويض','عوض','وزع','وزّع'))return'catchup';
  if(has('رتب','باقي اليوم','باقي يومي','خطه اليوم','خطة اليوم','جدول اليوم','اليوم ده'))return'plan';
  if(has('متاخر','فاتني','فاتتني','تراكم','متراكم','قصرت','مقصر'))return'late';
  if(has('امتحان','اختبار','درجات'))return'exams';
  if(has('ماشي','تقدم','انجاز','الاسبوع','اسبوع','مستوايا','التزام'))return'progress';
  if(has('اذاكر','ذاكر','ابدا','ابدأ','اعمل ايه','دلوقتي','الان','المهمه'))return'now';
  if(has('النهارده','يومي','تقرير'))return'today';
  return'help';
}
function askNow(q,i){
  q=String(q||'').trim().slice(0,120);if(!q)return;

  else if(i==='plan'){const t=today();UI.cu=null;const od=overdue();if(od.length){cuMake(1);UI.cu.items=UI.cu.items.filter(z=>z.pieces.length)}}

}

const isBlockT=x=>!!x.blk||!!x.from;

function sleepAfter(x){      // ساعات النوم المتاحة بعد نهاية النشاط لحد أول حاجة مش اختيارية بكرة (بنفترض الصحيان قبلها بنص ساعة)

  if(!nx)return null;return (1440-x.e+nx.s-30)/60;
}
function gameHint(x){
  const b=blkStat(x.date),sl=sleepAfter(x);

  const z=sl!==null&&sl<7?` تنبيه: لو لعبت لحد ${t12(x.e)} هتنام حوالي ${(Math.round(sl*10)/10)} ساعات بس (أقل من 7)، فبلاش.`:'';
  return `<div class="card alert" style="margin:0 0 10px"><div class="sm">${a}${z}</div></div>`;
}

const topBl=sub=>blSorted().find(x=>x.sub===sub&&x.done<x.total)||null;

function planReport(){
  const out=[];
  for(let i=0;i<7;i++){
    const ref=addDays(NEW3,((i-dIdx(NEW3))%7+7)%7),bs=sched().filter(b=>b.d===i&&activeOn(b,ref)),r={d:i,hw:0,rv:0,bk:0,cls:0,gym:0,game:0,life:0,blocks:0,rest:0,opt:0};
    bs.forEach(b=>{let du=b.e-b.s;if(du<=0)du+=1440;
      if(b.opt){r.opt+=du;return}
      if(b.blk&&STUDY.includes(b.sub)){r[b.cat==='hw'||b.cat==='bk'?b.cat:'rv']+=du;r.blocks++;r.rest+=10}
      else if(STUDY.includes(b.sub))r.cls+=du;
      else if(b.sub==='gym')r.gym+=du;else if(b.sub==='game')r.game+=du;else r.life+=du});
    const ne=bs.filter(b=>!b.opt),last=Math.max(...ne.map(b=>b.e<=b.s?b.e+1440:b.e),0);
    const nx=sched().filter(b=>b.d===(i+1)%7&&activeOn(b,addDays(ref,1))&&!b.opt).sort((a,b)=>a.s-b.s)[0];
    r.sleep=nx&&ne.length?(1440-last+nx.s-30)/60:null;r.study=r.hw+r.rv+r.bk;out.push(r)}
  return out;
}

function motive(){
  const t=today(),c=calc(),ts=tasksOf(t).filter(counted),done=ts.filter(x=>st(t,x.id)===1).length;
  const p=ts.length?done/ts.length:0,m=minsOn(t),goal=S.cfg.goalDay,od=overdue().length;
  const seed=parseInt(t.slice(-2))+Math.floor(new Date().getHours()/5);
  const pick=a=>a[seed%a.length];
  const y=addDays(t,-1),yMissed=y>=S.created&&!c.qual[y];
  const rem=Math.max(0,goal-m);
  if(ts.length&&p>=.999)return{h:pick(['✅ خلصت خطة اليوم. اقفل اليوم وانت مطمن.','✅ يوم كامل! بكرة نكمل بنفس الروح.']),s:'تقدر ترتاح وتلعب من غير ذنب.'};
  if([3,7,14,30].includes(c.streak)&&c.qual[t])return{h:`🔥 ${c.streak} أيام! الاستمرارية بدأت تبان.`,s:'كل يوم بيتحسب، كمّل.'};
  if(m>=goal)return{h:'🔥 جامد جدًا! أنت بتبني عادة قوية.',s:'وصلت هدفك اليومي. اللي بعد كده مكسب زيادة.'};
  if(yMissed&&m===0)return{h:'يوم واحد مش هيحدد مستواك.',s:'ابدأ من جديد اليوم 🔥'};
  if(od>=3)return{h:'متراكم عليك شوية؟ ولا يهمك، نبدأ بأصغر مهمة.',s:'قدامك '+od+' مهام متأخرة. هنرتبهم مع بعض.'};
  if(m>0&&m<goal/2)return{h:'حتى '+Math.max(20,m)+' دقيقة محسوبة. المهم إنك بدأت.',s:`باقي ${hm(rem)} وتكمل هدفك اليومي.`};
  if(p>0)return{h:`أنجزت ${pc(p)}% من خطة اليوم 🔥`,s:rem?`باقي ${hm(rem)} وتكمل هدفك اليومي.`:'كمّل لحد ما تخلّص خطة اليوم.'};
  return{h:pick(['استمرارك اليوم = تقدمك في الثانوية.','أول جلسة هي الأصعب. ابدأ بـ 25 دقيقة.','مفيش يوم ضايع. ابدأ بأي مهمة.']),s:`هدف النهارده ${hm(goal)}.`};
}

async function notify(title,body){
  try{
    if('Notification' in window&&Notification.permission==='granted'){
      const reg=navigator.serviceWorker&&navigator.serviceWorker.getRegistration?await navigator.serviceWorker.getRegistration():null;
      if(reg&&reg.showNotification){await reg.showNotification(title,{body,icon:'icon-192.png',lang:'ar',dir:'rtl'});return}
      new Notification(title,{body,lang:'ar',dir:'rtl'});return;
    }
  }catch(e){}
  toast(title+(body?' — '+body:''));
}

/* ---------- تقدمي الدراسي: عدّ مهام المذاكرة من الجدول الحالي (مشتق من حالة المهام، مفيش بيانات جديدة) ---------- */
function tally(from,to){
  let tot=0,done=0,part=0;
  for(const d of eachDate(from<S.created?S.created:from,to))for(const x of tasksOf(d)){
    if(!counted(x)||!isStudyT(x))continue;const s=st(d,x.id);if(s===4||s===5)continue;   // المتخطاة والمؤجلة مش بتتحسب
    tot++;if(s===1)done++;else if(s===2)part++;
  }
  return{tot,done,part,left:tot-done,pct:tot?(done+part*.5)/tot:0};
}
const D2=['سبت','أحد','اثنين','ثلاثاء','أربعاء','خميس','جمعة'];
function chart7(mode){
  const t=today(),items=eachDate(addDays(t,-6),t).map(d=>{
    if(mode==='hrs'){const m=minsOn(d);return{l:D2[dIdx(d)],v:m,c:'var(--accent)',txt:m?hmShort(m):'',d}}
    const p=d<S.created?null:dayPct(d);
    return{l:D2[dIdx(d)],v:p===null?0:Math.round(p*100),c:p===null?'var(--muted)':p>=.7?'var(--good)':p>=.4?'var(--warn)':'var(--bad)',txt:p===null?'':pc(p)+'%',d}});
  const max=mode==='hrs'?Math.max(S.cfg.goalDay,...items.map(i=>i.v),1):100;
  return `<div class="cols">${items.map(i=>`<div class="col"><span class="cv num">${i.txt}</span><div class="cb" style="height:${Math.max(i.v?3:2,Math.round(i.v/max*100))}px;background:${i.c};opacity:${i.v?1:.35}${i.d===t?';outline:2px solid var(--accent);outline-offset:1px':''}"></div><span class="cl" ${i.d===t?'style="color:var(--fg);font-weight:700"':''}>${i.l}</span></div>`).join('')}</div>`;
}

/* ---------- تحدّي الأسبوع + سباق مع نفسي ---------- */
const BOSSES=['وحش الواجبات','تنين المراجعة','عفريت الأخطاء','ملك التراكمات','شبح التأجيل','عملاق الامتحانات'];
function bossInfo(){
  const t=today(),wk=weekStart(t),goal=Math.max(60,S.cfg.goalWeek||1680),wm=minsRange(wk,addDays(wk,6)),pct=clamp(wm/goal,0,1);
  const n=Math.max(0,Math.floor(daysBetween(S.created,wk)/7));
  return{wk,goal,wm,pct,name:BOSSES[n%BOSSES.length],beaten:wm>=goal,won:Object.keys(S.boss||{}).length};
}
function bossSync(){
  const b=bossInfo();
  if(b.beaten&&!(S.boss&&S.boss[b.wk])){S.boss=S.boss||{};S.boss[b.wk]={min:b.wm,goal:b.goal};save();setTimeout(()=>toast(`هزمت ${b.name}! خلّصت هدف الأسبوع 🏆`),400)}
}
function raceCard(){
  const t=today(),by={};S.log.forEach(x=>{by[x.date]=(by[x.date]||0)+x.min});
  const m0=by[t]||0,y=by[addDays(t,-1)]||0,lw=by[addDays(t,-7)]||0;
  let best=0,bd=null;Object.keys(by).forEach(d=>{if(d<t&&by[d]>best){best=by[d];bd=d}});
  const mx=Math.max(m0,y,lw,best,1),rows=[['النهارده',m0,1],['أمس',y,0],['نفس اليوم الأسبوع اللي فات',lw,0],['أفضل يوم ليك',best,0]];
  const msg=best&&m0>best?'كسرت رقمك القياسي! 🔥':y&&m0>y?`قدّام أمس بـ ${hm(m0-y)}`:y&&m0<y?`ورا أمس بـ ${hm(y-m0)} — لسه الوقت قدامك`:m0?'ماشي كويس، كمّل':'ابدأ أول جلسة وسابق نفسك';
  return `<div class="race">${rows.map(([l,v,me])=>`<div class="rc ${me?'me':''}"><span>${l}</span><span class="t"><i style="width:${pc(v/mx)}%"></i></span><span class="v num">${v?hmShort(v):'—'}</span></div>`).join('')}</div><div class="muted sm" style="margin-top:8px">${msg}</div>`;
}

/* ---------- نومك وتشتيت الموبايل مقابل مذاكرتك (من بياناتك المسجّلة) ---------- */

/* إعادة تنظيم مهام اليوم: بتستخدم نفس postpone/تخطي الموجودين؛ مفيش حذف ومفيش لمس للمهام الخالصة/الدرجات/السجلات/الأخطاء */
function reorgApply(){
  const m=UI.modal;if(!m||m.t!=='reorg')return;
  const t=today(),snap=JSON.stringify([S.custom,S.done,S.ov]);let moved=0,dropped=0,fail=0;
  try{
    for(const k of Object.keys(m.pl)){
      const v=m.pl[k];if(v==='keep')continue;
      const x=findTask(k);if(!x||![0,3].includes(st(x.date,x.id))||x.cat==='cls'){fail++;continue}
      if(v==='drop'){S.done[k]=4;S.ov[k]=Object.assign({},S.ov[k],{reason:'استبعدتها من خطة اليوم'});dropped++}
      else if(postpone(k,v==='tom'?addDays(t,1):t))moved++;else fail++;
    }
    save();
  }catch(e){dbg('reorg',e);const r=JSON.parse(snap);S.custom=r[0];S.done=r[1];S.ov=r[2];save();toast('حصلت مشكلة فرجّعنا كل حاجة زي ما كانت');UI.modal=null;render();return}
  UI.modal=null;render();
  toast(`اتأجّل ${moved} · اتستبعد ${dropped}${fail?` · ${fail} ما اتنفّذتش (مفيش وقت فاضي)`:''}`);
}

function rangeDates(){
  const t=today(),r=UI.range;
  if(r==='week')return[weekStart(t),t];
  if(r==='last7')return[addDays(t,-6),t];
  if(r==='month'){const d=parse(t);return[ymd(new Date(d.getFullYear(),d.getMonth(),1,12)),t]}
  return[S.created,t];
}
const verdict=r=>r>=.8?['ممتاز','g']:r>=.6?['كويس','w']:['محتاج شغل','b'];
function insights(a){
  const out=[];
  if(!a.due)return out;
  const rows=Object.entries(a.subj).map(([k,v])=>({k,r:v.sc/v.due,due:v.due})).filter(x=>x.due>=1).sort((x,y)=>y.r-x.r);
  if(rows.length){
    const best=rows[0],worst=rows[rows.length-1];
    if(best.r>=.7)out.push(['g',`أقوى التزام عندك في <b>${SUBJ[best.k].n}</b> (${pc(best.r)}%). كمّل بنفس النظام.`]);
    if(worst.r<.8&&rows.length>1||worst.r<.6)out.push([worst.r<.6?'b':'w',`أكتر مادة مقصّر فيها <b>${SUBJ[worst.k].n}</b> (${pc(worst.r)}%).`]);
  }
  const ms=Object.values(a.miss).sort((x,y)=>y.n-x.n)[0];
  if(ms&&ms.n>=2)out.push(['b',`أكتر بند بيفوتك: <b>${esc(ms.b.t)}</b> (${DAYS[ms.b.d]}) فاتك ${ms.n} مرات. جرب تقدّمه أو تقسّمه.`]);
  const wds=a.wd.map((w,i)=>({i,due:w.due,r:w.due?w.sc/w.due:null})).filter(x=>x.r!==null);
  if(wds.length>=3){wds.sort((x,y)=>x.r-y.r);const w=wds[0],b=wds[wds.length-1];
    if(w.r<.7&&w.r<b.r-.15)out.push(['w',`أضعف يوم عندك <b>${DAYS[w.i]}</b> (${pc(w.r)}%) وأحسن يوم <b>${DAYS[b.i]}</b> (${pc(b.r)}%).`]);}
  const tgt=S.cfg.target;
  const by={};S.scores.filter(x=>x.date>=a.from&&x.date<=a.to).forEach(x=>{(by[x.sub]||(by[x.sub]=[])).push(x.score/x.max*100)});
  Object.entries(by).forEach(([k,v])=>{const av=v.reduce((p,c)=>p+c,0)/v.length;
    out.push([av>=tgt?'g':av>=tgt-10?'w':'b',`متوسط درجاتك في <b>${SUBJ[k].n}</b> ${Math.round(av)}% ${av>=tgt?'وده فوق هدفك '+tgt+'%':'وناقص '+Math.round(tgt-av)+'% عن هدفك'}.`])});
  const ov=a.sc/a.due;
  if(a.gameM>0&&ov<.6)out.push(['w',`لعبت ${hm(a.gameM)} والتزامك بالمذاكرة ${pc(ov)}%. اللعب بعد المذاكرة بس.`]);
  if(!out.length)out.push(['i','سجّل أيام أكتر وهيظهرلك تحليل أدق.']);
  return out;
}

}

  return `<div class="hmap">${cells}</div><div class="legend" style="margin-top:8px"><span>أقل</span><span class="hz l0 in"></span><span class="hz l1 in"></span><span class="hz l2 in"></span><span class="hz l3 in"></span><span class="hz l4 in"></span><span>أكتر</span></div>`;
}

function lineChart(){
  const sc=S.scores.slice().sort((a,b)=>a.date<b.date?-1:1);
  if(!sc.length)return '';
  const W=320,Ht=170,L=34,R=10,T0=10,Bm=26,x0=sc[0].date,x1=sc[sc.length-1].date;
  const span=Math.max(1,(parse(x1)-parse(x0))/864e5);
  const X=d=>L+(sc.length===1||x0===x1?(W-L-R)/2:(parse(d)-parse(x0))/864e5/span*(W-L-R));
  const Y=v=>T0+(1-Math.min(100,Math.max(0,v))/100)*(Ht-T0-Bm);
  let g='';
  [0,50,100].forEach(v=>g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${v}</text>`);
  g+=`<line x1="${L}" x2="${W-R}" y1="${Y(S.cfg.target)}" y2="${Y(S.cfg.target)}" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="${W-R}" y="${Y(S.cfg.target)-4}" text-anchor="end" font-size="10" fill="var(--accent)">الهدف ${S.cfg.target}</text>`;
  const subs=[...new Set(sc.map(s=>s.sub))];
  subs.forEach(k=>{const pts=sc.filter(s=>s.sub===k).map(s=>[X(s.date),Y(s.score/s.max*100)]);
    g+=`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${SUBJ[k].c}" stroke-width="2.4" stroke-linejoin="round"/>`+pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="${SUBJ[k].c}" stroke="var(--surface)" stroke-width="1.5"/>`).join('')});
  g+=`<text x="${L}" y="${Ht-6}" font-size="10" fill="var(--muted)" text-anchor="start">${dateTxt(x0)}</text>`;

function vWeekReport(){

  const bestS=rows[0],worstS=rows.length>1?rows[rows.length-1]:null;
  let topD=null;eachDate(ws,we).forEach(d=>{const m=minsOn(d);if(d<=t&&m>0&&(!topD||m>topD.m))topD={d,m}});

/* ---------- search ---------- */
function searchRes(q){
  q=(q||'').trim();if(!q)return[];
  const res=[],nq=nz(q),has=s=>nz(s).includes(nq);
  STUDY.forEach(k=>{if(has(SUBJ[k].n))res.push(['مادة',SUBJ[k].n,'','subject',k])});
  const seen=new Set();
  sched().filter(b=>!b.x1||b.x1>today()).forEach(b=>{if(has(b.t)||has(SUBJ[b.sub].n)||has(TYPES[b.type])){const kk=b.t+b.d;if(!seen.has(kk)){seen.add(kk);res.push(['مهمة',b.t,DAYS[b.d]+' · '+t12(b.s),'task',null,b.d])}}});
  S.custom.forEach(c=>{if(has(c.t))res.push(['مهمة',c.t,dateTxt(c.date),'day',c.date])});
  S.exams.forEach(e=>{if(has(e.name)||has(e.syll)||has(SUBJ[e.sub].n))res.push(['امتحان',e.name,dateTxt(e.date),'exams'])});
  S.reviews.forEach(r=>{if(has(r.topic))res.push(['مراجعة',r.topic,SUBJ[r.sub].n,'reviews'])});
  S.weak.forEach(w=>{if(has(w.text))res.push(['نقطة ضعف',w.text,SUBJ[w.sub].n,'exams'])});
  (S.mist||[]).forEach(m=>{if(has(m.t))res.push(['غلطة',m.t,SUBJ[m.sub].n,'mist'])});
  (S.bl||[]).forEach(b=>{if(has(b.t))res.push(['تراكم',b.t,SUBJ[b.sub].n+' · '+b.done+' من '+b.total+' '+b.unit,'plan'])});
  DAYS.forEach((n,i)=>{if(has(n))res.push(['يوم',n,'','weekday',i])});
  if(/^\d{4}-\d{2}-\d{2}$/.test(q))res.push(['تاريخ',dateTxt(q),q,'day',q]);
  return res;
}
function searchHtml(q){
  q=(q||'').trim();
  if(!q)return empty('اكتب أي كلمة وهدوّر في كل حاجة (بيتحدّث وأنت بتكتب).');
  const res=searchRes(q);
  if(!res.length)return empty('مفيش نتايج لـ «'+esc(q)+'». جرّب كلمة أقصر أو اسم المادة.');
  const act=r=>r[3]==='subject'?`data-act="subject" data-s="${r[4]}"`:r[3]==='day'?`data-act="open" data-d="${r[4]}"`:r[3]==='weekday'?`data-act="openWeekday" data-i="${r[4]}"`:r[3]==='task'?`data-act="openWeekday" data-i="${r[5]}"`:`data-act="nav" data-t="${r[3]}"`;
  return `<div class="muted sm" style="margin-bottom:6px">${res.length} ${res.length>2&&res.length<11?'نتايج':'نتيجة'}${res.length>40?' (أول 40)':''}</div>`+res.slice(0,40).map(r=>`<button class="it lnkit" ${act(r)}><span class="badge w">${r[0]}</span><div class="g"><b>${esc(r[1])}</b><div class="muted sm">${esc(r[2])}</div></div>${I.left}</button>`).join('');
}

async function exportData(){

  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));a.download=fn;document.body.appendChild(a);a.click();a.remove();toast('تم تنزيل النسخة')}catch(e){toast('التنزيل مش متاح هنا')}

    case'blDel':{const i=(S.bl||[]).find(z=>z.id===ds.id);if(i&&confirm(`تحذف «${i.t}» من قايمة التراكمات؟`)){S.bl=S.bl.filter(z=>z.id!==ds.id);save();render()}break}
    case'cuOpen':UI.tab!=='assist'&&nav('assist');askNow('اقترح خطة تعويض','catchup');break;
    case'cuAccept':{const n=cuAccept(k);render();if(n)toast('اتضافت للجدول');break}
    case'cuReject':if(UI.cu){UI.cu.items=UI.cu.items.filter(z=>z.key!==k)}render();toast('اتلغى الاقتراح — المهمة زي ما هي');break;
    case'cuAll':{let n=0;if(UI.cu)UI.cu.items.filter(z=>z.pieces.length).map(z=>z.key).forEach(kk=>{n+=cuAccept(kk)});render();toast(n?`اتضافت ${n} ${n>2?'مهام':'مهمة'} للجدول`:'مفيش حاجة اتضافت');break}
    case'cuRefresh':cuMake(UI.cu?UI.cu.days:15);render();break;
    case'postpone':{const x=findTask(k);const d=addDays(today(),+ds.n);if(x&&postpone(k,d)){UI.modal=null;toast('اتأجلت إلى '+dateTxt(d))}render();break}
    case'postponeDate':{const d=($('#pDate')||{}).value;if(d&&postpone(k,d)){UI.modal=null;toast('اتأجلت إلى '+dateTxt(d))}render();break}
    case'skip':S.done[k]=4;S.ov[k]=Object.assign({},S.ov[k],{reason:ds.r});save();UI.modal=null;render();toast('اتخطت: '+ds.r+' — ولا يهمك');break;
    case'durAdj':{const x=findTask(k);if(x){S.ov[k]=Object.assign({},S.ov[k],{dur:clamp(x.dur+ +ds.n,5,600)});save();render()}break}
    case'delCustom':{const i=k.indexOf('|'),id=k.slice(i+1),cc=S.custom.find(c=>c.id===id);S.custom=S.custom.filter(c=>c.id!==id);delete S.done[k];delete S.ov[k];
      if(cc&&cc.from&&S.done[cc.from]===5&&!S.custom.some(c=>c.from===cc.from)){delete S.done[cc.from];if(S.ov[cc.from])delete S.ov[cc.from].movedTo}   // الأصلية ترجع مش مفقودة
      save();UI.modal=null;render();break}
    case'addTask':UI.modal={t:'addtask',d:ds.d};render();break;
    case'closeModal':UI.modal=null;render();break;
    case'day':UI.date=addDays(UI.date,+ds.n);render();break;
    case'goToday':UI.date=today();render();break;
    case'open':UI.modal=null;UI.date=ds.d;nav('today');break;
    case'openWeekday':UI.date=addDays(weekStart(today()),+ds.i);nav('today');break;
    case'dayModal':UI.modal={t:'day',d:ds.d};render();break;
    case'wk':UI.wk=addDays(UI.wk,7*ds.n);render();break;
    case'range':UI.range=ds.r;render();break;
    case'statTab':UI.stat=ds.s;render();break;
    case'calNav':{const[y,m]=UI.cal.split('-').map(Number);const d=new Date(y,m-1+ +ds.n,1,12);UI.cal=ymd(d).slice(0,7);render();break}
    case'rd':UI.rd=addDays(UI.rd,+ds.n);render();break;
    case'rw':UI.rw=addDays(UI.rw,7*ds.n);render();break;
    case'subject':nav('subject',{sub:ds.s});break;
    case'redistribute':{const l=overdue();const n=distribute(l,weekEnd());render();toast(n?`اتوزعت ${n} ${n>2?'مهام':'مهمة'} على الأيام الجاية${distribute.fail?` (و${distribute.fail} ما لقيناش لها مساحة كاملة فسبناها زي ما هي)`:''}`:'مفيش مساحة كفاية، جرب تأجّل واحدة واحدة');break}
    case'replan':{const n=distribute(overdue(),weekEnd());render();toast(n?'الخطة اتأخرت شوية، عادي. رتبنا باقي الأسبوع.':'مفيش مساحة كفاية في الأسبوع');break}
    case'rescue':if(T.running||tElapsed()>0){UI.fm=true;render();break}startRescue();render();break;
    case'rescue2':UI.modal=null;startRescue2();render();break;
    case'examRes':UI.modal={t:'examres',id:ds.id};render();break;
    case'delExam':S.exams=S.exams.filter(x=>x.id!==ds.id);save();render();break;
    case'delScore':S.scores=S.scores.filter(x=>x.id!==ds.id);S.exams.forEach(x=>{if(x.scoreId===ds.id)delete x.scoreId});save();render();break;
    case'togWeak':{const w=S.weak.find(x=>x.id===ds.id);if(w){w.done=!w.done;save();render()}break}
    case'delWeak':S.weak=S.weak.filter(x=>x.id!==ds.id);save();render();break;
    case'revDone':{const r=S.reviews.find(x=>x.id===ds.id);if(r){(r.hist=r.hist||[]).push(today());r.stage++;if(r.stage>=INTERVALS.length)r.fin=true;else if(nextDue(r)<=today())r.floor=addDays(today(),1);save();render();toast('تمام، المراجعة اتسجلت '+lplus(10)+' XP')}break}
    case'revForgot':{const r=S.reviews.find(x=>x.id===ds.id);if(r){r.stage=0;r.learned=today();r.floor=null;save();render();toast('ولا يهمك، هنبدأ المراجعة من الأول')}break}
    case'delRev':S.reviews=S.reviews.filter(x=>x.id!==ds.id);save();render();break;
    case'equip':{S.equip[ds.k]=ds.id;save();render();break}
    case'buy':{const it=SHOP[ds.k].find(x=>x[0]===ds.id);if(it&&calc().coins>=it[2]&&!S.owned[ds.k].includes(ds.id)){S.spent+=it[2];S.owned[ds.k].push(ds.id);S.equip[ds.k]=ds.id;save();render();toast('اشتريت '+it[1])}break}
    case'theme':S.cfg.theme=ds.t;save();render();break;
    case'font':S.cfg.font=ds.f;save();render();break;
    case'export':exportData();break;
    case'import':$('#fImp').click();break;
    case'notifTest':
      (async()=>{try{if('Notification' in window&&Notification.permission==='default')await Notification.requestPermission()}catch(x){}notify('مذاكرتي','ده إشعار تجريبي');})();break;
    case'reset':
      if(!UI.resetArm){UI.resetArm=true;render();setTimeout(()=>{if(UI.resetArm){UI.resetArm=false;if(UI.tab==='settings')render()}},4000)}
      else{snapPre('reset');S=fresh();save();UI.resetArm=false;resetT(false);UI.tab='home';UI.prev=[];render();toast('تم المسح')}
      break;
    case'sd':UI.sd=+ds.i;render();break;
    case'editBlock':UI.modal={t:'block',id:ds.id};render();break;
    case'newBlock':UI.modal={t:'block',day:+ds.d};render();break;
    case'delBlock':{ensureSched();const b=S.sched.find(x=>x.id===ds.id);
      if(b){if(b.x0&&b.x0>=today())S.sched=S.sched.filter(x=>x.id!==b.id);else b.x1=today()}      // الأيام اللي فاتت تفضل زي ما كانت
      save();UI.modal=null;render();break}
    case'schedReset':
      if(!UI.resetArm){UI.resetArm=true;render();setTimeout(()=>{UI.resetArm=false;if(UI.tab==='sched')render()},4000)}
      else{S.sched=null;UI.resetArm=false;save();render();toast('رجع الجدول الأصلي')}break;
  }
});
function ensureSched(){if(!S.sched)S.sched=JSON.parse(JSON.stringify(SCHEDULE))}

/* ---------- changes ---------- */
document.addEventListener('change',e=>{
  const id=e.target.id,v=e.target.value,key=e.target.dataset&&e.target.dataset.k;
  if(id==='trSleep'||id==='trPhone'){const d=e.target.dataset.d;if(/^\d{4}-\d{2}-\d{2}$/.test(d||'')){S.track=S.track||{};const o=Object.assign({},S.track[d]),f=id==='trSleep'?'sleep':'phone',n=parseFloat(v);
      if(v===''||!isFinite(n)||n<0||n>(f==='sleep'?24:1440))delete o[f];else o[f]=f==='sleep'?Math.round(n*2)/2:Math.round(n);
      if(Object.keys(o).length)S.track[d]=o;else delete S.track[d];save();toast('اتحفظ')}return}
  if(e.target.dataset&&e.target.dataset.bl){const i=(S.bl||[]).find(z=>z.id===e.target.dataset.bl),f=e.target.dataset.f,n=Math.floor(+v);
    if(i&&Number.isFinite(n)){if(f==='done')i.done=clamp(n,0,i.total);else if(f==='total'){i.total=clamp(n,1,999);i.done=Math.min(i.done,i.total)}else if(f==='pri'&&n>=1&&n<=4)i.pri=n;save();setTimeout(render,0)}return}
  if(id==='cuDay'){cuChangeDay(key,v);render();return}
  if(id==='tSub'){T.sub=v;saveT()}
  else if(id==='tTask'){T.task=v;const x=v?findTask(v):null;T.sub=x?x.sub:'';saveT();render()}
  else if(id==='tSound'){S.equip.sound=v;save();if(T.running&&T.mode==='focus')ambStart(v)}
  else if(id==='mDur'&&key){S.ov[key]=Object.assign({},S.ov[key],{dur:clamp(parseInt(v)||60,5,600)});save();render()}
  else if(id==='mType'&&key){S.ov[key]=Object.assign({},S.ov[key],{type:v});save();render()}
  else if(id==='mSub'&&key){S.ov[key]=Object.assign({},S.ov[key],{sub:v});save();render()}
  else if(id==='cGD'){S.cfg.goalDay=Math.round(numv(id,.5,14,3)*60);save()}
  else if(id==='cGW'){S.cfg.goalWeek=Math.round(numv(id,1,100,28)*60);save()}
  else if(id==='cGM'){S.cfg.goalMonth=Math.round(numv(id,1,400,112)*60);save()}
  else if(id==='cMin'){S.cfg.minDaily=Math.round(numv(id,5,120,20));save()}
  else if(id==='cTarget'){S.cfg.target=numv(id,1,100,85);S.cfg.tgtSet=true;save()}
  else if(id==='cPreset'){S.cfg.preset=v;save();if(!T.running&&tElapsed()===0)syncT()}
  else if(id==='cCF'){S.cfg.cf=Math.round(numv(id,5,120,30));save();if(!T.running&&tElapsed()===0)syncT()}
  else if(id==='cCR'){S.cfg.cr=Math.round(numv(id,1,30,10));save();if(!T.running&&tElapsed()===0)syncT()}
  else if(id==='cBeep'){S.cfg.beep=e.target.checked;save()}
  else if(id==='cVib'){S.cfg.vibrate=e.target.checked;save()}
  else if(id==='cAuto'){S.cfg.autoFocus=e.target.checked;save()}
  else if(id==='nOn'){
    S.cfg.notif.on=e.target.checked;save();
    if(e.target.checked){
      const ns=notifState(),off=msg=>{S.cfg.notif.on=false;save();render();toast(msg)};
      if(ns==='unsupported')off('المتصفح ده مش بيدعم الإشعارات');
      else if(ns==='denied')off('الإذن مرفوض من المتصفح — فعّله من إعدادات الموقع');
      else if(ns==='default'){try{Promise.resolve(Notification.requestPermission()).then(r=>{if(r!=='granted')off('الإذن ما اتمنحش، فالإشعارات اتقفلت');else render()}).catch(()=>off('تعذّر طلب الإذن'))}catch(x){off('تعذّر طلب الإذن')}}
    }
  }
  else if(id==='nNext'){S.cfg.notif.next=e.target.checked;save()}
  else if(id==='nOver'){S.cfg.notif.over=e.target.checked;save()}
  else if(id==='nGoal'){S.cfg.notif.goal=e.target.checked;save()}
  else if(id==='nStk'){S.cfg.notif.streak=e.target.checked;save()}
  else if(/^w[1-5]$/.test(id)){const m={w1:'tasks',w2:'adh',w3:'time',w4:'tests',w5:'rev'};S.cfg.w[m[id]]=Math.round(numv(id,0,100,0));save()}
  else if(id==='fImp'){
    const f=e.target.files[0];if(!f)return;const rd=new FileReader();
    rd.onload=()=>{try{const o=JSON.parse(rd.result);if(!o||typeof o!=='object'||Array.isArray(o)||!(o.done||o.log||o.sched||o.custom||o.cfg))throw 0;const nx=norm(o);snapPre('import');S=nx;save();UI.modal=null;render();toast('تم الاسترجاع (واتحفظت نسخة من بياناتك اللي قبله)'+(migNote?' · '+migNote:''));migNote=''}catch(x){dbg('import',x);toast('الملف ده مش نسخة صالحة')}e.target.value=''};
    rd.readAsText(f);
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='sq'){UI.q=e.target.value;const r=$('#sres');if(r)r.innerHTML=searchHtml(UI.q);const b=$('#sqx');if(b)b.hidden=!UI.q}
});

/* ---------- forms ---------- */
document.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target,id=f.id;
  if(id==='fAsk'){askNow($('#aq').value);return}
  if(id==='fMist'||id==='fQM'){const q=id==='fMist'?['mSub','mT']:['qmSub','qmT'];
    if(mistAdd($('#'+q[0]).value,$('#'+q[1]).value)){if(id==='fQM')UI.modal=null;render();toast('اتسجّلت — هتتحل تاني بعد 3 أيام')}else toast('اكتب الغلطة الأول');return}
  if(id==='fBl'){const sub=$('#blSub').value,t=$('#blT').value.trim(),n=Math.floor(+$('#blN').value),p=+$('#blP').value;
    if(!STUDY.includes(sub)||!t||!(n>=1)){toast('اكتب اسم التراكم وإجمالي صحيح');return}
    S.bl=S.bl||[];S.bl.push({id:uid('b'),sub,t:t.slice(0,80),unit:($('#blU').value.trim()||'جزء').slice(0,12),total:Math.min(999,n),done:0,pri:[1,2,3,4].includes(p)?p:3});save();render();toast('اتضاف');return}
  if(id==='fScore'){
    const sub=$('#sSub').value,date=$('#sDate').value||today(),score=parseFloat($('#sScore').value),max=parseFloat($('#sMax').value);
    if(!isFinite(score)||!isFinite(max)||max<=0||score<0){toast('راجع الأرقام');return}
    S.scores.push({id:uid('s'),sub,date,score,max,note:$('#sNote').value.trim()});save();render();toast('اتسجلت الدرجة');
  }else if(id==='fWeak'){
    const text=$('#wText').value.trim();if(!text)return;
    S.weak.unshift({id:uid('w'),sub:$('#wSub').value,text,done:false});save();render();
  }else if(id==='fExam'){
    S.exams.push({id:uid('e'),name:$('#eN').value.trim(),sub:$('#eSub').value,date:$('#eD').value,max:numv('eMax',1,1e6,100),pass:numv('ePass',1,100,50),syll:$('#eSy').value.trim()});
    save();render();toast('اتضاف الامتحان');
  }else if(id==='fExamRes'){
    const ex=S.exams.find(x=>x.id===f.dataset.id);if(!ex||ex.scoreId)return;
    const score=parseFloat($('#erScore').value),max=parseFloat($('#erMax').value);
    if(!isFinite(score)||!isFinite(max)||max<=0){toast('راجع الأرقام');return}
    const sid=uid('s');S.scores.push({id:sid,sub:ex.sub,date:today()<ex.date?today():ex.date,score,max,note:ex.name,examId:ex.id});ex.scoreId=sid;ex.max=max;
    save();UI.modal=null;render();toast('اتسجلت النتيجة '+lplus(40)+' XP');
  }else if(id==='fRev'){
    const topic=$('#rT').value.trim();if(!topic)return;
    S.reviews.push({id:uid('r'),sub:$('#rSub').value,topic,learned:$('#rD').value||today(),stage:0,hist:[]});save();render();toast('اتضاف للمراجعة');
  }else if(id==='fManual'){
    const min=Math.round(parseFloat($('#mnMin').value));if(!(min>=1)){toast('اكتب عدد الدقايق');return}
    const key=f.dataset.k,before=calc().xp;
    if(min>720){toast('الحد الأقصى 12 ساعة في التسجيل الواحد');return}
    if(!addLog({sub:$('#mnSub').value,task:key,min,src:'manual',type:$('#mnType').value,date:$('#mnDate').value||today()})){toast('راجع الوقت والتاريخ');return}
    autoDoneCheck(key);save();UI.modal=null;render();toast(`اتسجل ${hm(min)} يدوي ${lplus(calc().xp-before)} XP`);
  }else if(id==='fTask'){
    const t=$('#ntT').value.trim(),d=$('#ntDate').value||today(),s=fromHM($('#ntS').value),dur=numv('ntDur',5,600,45);
    if(!t)return;
    S.custom.push({id:uid('c'),date:d,s,e:s+dur,sub:$('#ntSub').value,t,type:$('#ntType').value});save();UI.modal=null;render();toast('اتضافت المهمة');
  }else if(id==='fBlock'){
    ensureSched();
    const t=$('#bT').value.trim(),s=fromHM($('#bS').value);let en=fromHM($('#bE').value);
    if(en===s){toast('وقت النهاية لازم يختلف عن البداية');return}
    if(en<s)en+=1440;                                    // فترة بتعدّي منتصف الليل (مثلًا 20:30 → 00:30)
    if(en-s<5||en-s>960){toast('مدة الفترة لازم تكون بين 5 دقايق و16 ساعة');return}
    const o={d:+$('#bD').value,sub:$('#bSub').value,type:$('#bType').value,s,e:en,t};
    const bid=f.dataset.id,t0=today();
    if(bid){const b=S.sched.find(x=>x.id===bid);
      if(b&&b.x0&&b.x0>=t0)Object.assign(b,o);
      else if(b){                                        // نقفل القديمة من النهارده ونفتح واحدة جديدة — التاريخ ما بيتغيّرش
        const nb=Object.assign({id:uid('b'),x0:t0},o);b.x1=t0;S.sched.push(nb);
        if(b.d===dIdx(t0)){const ok=t0+'|'+b.id,nk=t0+'|'+nb.id;if(S.done[ok]){S.done[nk]=S.done[ok];delete S.done[ok]}if(S.ov[ok]){S.ov[nk]=S.ov[ok];delete S.ov[ok]}}
      }}
    else S.sched.push(Object.assign({id:uid('b'),x0:t0},o));
    UI.sd=o.d;save();UI.modal=null;render();toast('اتحفظت الفترة');
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(UI.modal){UI.modal=null;render()}else if(UI.fm){UI.fm=false;render()}}});

/* ---------- boot ---------- */
setInterval(tick,500);
/* تاب تانية عدّلت البيانات: نقرأها بدل ما نكتب فوقها */
window.addEventListener('storage',e=>{
  try{
    if(e.key===KEY&&e.newValue){const nx=norm(JSON.parse(e.newValue));if(nx.updatedAt>=S.updatedAt){S=nx;_ck='';applyLook();if(!UI.modal)render()}}
    else if(e.key==='studyTimer.v2'&&e.newValue){const t=JSON.parse(e.newValue);if(t&&t.mode){T=cleanT(t);if(!UI.modal)render()}}
  }catch(x){dbg('storage sync',x)}
});
setInterval(()=>{if(!UI.modal&&!UI.fm&&['home','today'].includes(UI.tab)&&!document.hidden&&document.activeElement===document.body)render()},30000);
setInterval(notifTick,30000);
document.addEventListener('visibilitychange',()=>{if(document.hidden)touchSeen();if(!document.hidden){notifTick();if(T.running&&T.mode==='focus')keepAwake(true);tick();if(!UI.modal&&['home','today'].includes(UI.tab))render()}});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if(T.running&&T.mode==='focus')UI.fm=true;
applyLook();syncT();render();initCloud();
if(T.running&&T.seen&&Date.now()-T.seen>90000){       // التطبيق اتقفل وهو شغال: نجمّد عند آخر نبضة بدل ما نحسب وقت ماحصلش
  if(T.kind==='open')T.acc+=Math.max(0,Math.floor((T.seen-T.startAt)/1000));
  else T.left=Math.max(0,Math.round((T.endAt-T.seen)/1000));
  T.running=false;saveT();
}
if(T.mode==='focus'&&!T.running&&!T.rescue&&tElapsed()>0){UI.modal={t:'rec'};UI.fm=false;render()}      // جلسة غير مكتملة: خيارات واضحة (كمّل/سجّل/تجاهل)
const touchSeen=()=>{if(T.running&&Date.now()-(T.seen||0)<=90000){T.seen=Date.now();saveT()}};   // ماننعشش النبضة لو الصفحة كانت متجمّدة/متوقفة أكتر من 90 ث (عشان الغياب مايتحسبش وقت مذاكرة)
window.addEventListener('pagehide',touchSeen);
{const bn=[bootNote,migNote].filter(Boolean).join(' · ');migNote='';if(bn)setTimeout(()=>toast(bn),900)}
if(T.running&&T.mode==='focus'){keepAwake(true)}
window.__ST={ensureSched,blkStat,sleepAfter,SCHEDULE_V2,SCHEDULE_V3,planReport,topBl,blHint,NEW_FROM,NEW2,NEW3,SCHEDULE_V4,SCHEDULE_V5,intentOf,cleanT,newT,tComplete,logSoFar,pickNow,tally,get S(){return S},set S(v){S=v},get T(){return T},set T(v){T=v},UI,calc,tasksOf,overdue,distribute,startSession,endSession,tick,agg,prog,findTask,save,render,addLog,postpone,nav,today,addDays,minsOn,pickTask,tFinish,tStart,tPause,rescueAvail};
if(window.__STANDALONE&&'serviceWorker' in navigator&&/^https?:/.test(location.protocol)){navigator.serviceWorker.register('sw.js').catch(()=>{})}

})();
</script>
